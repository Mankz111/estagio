name: hello

on:
  push:
    branches:
      - main



jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: build
      run: |
        echo "Build Docker"
        docker build -t exec1 .

  run_docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: run
        run: |
          echo "Running Docker"
          docker run -d -p 8000:80 exec1
    

