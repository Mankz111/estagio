name: build azure

on:
  push:
    branches:
      - main
env:
 IMAGE_NAME: exec1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: login azure
      uses: azure/login@v1
      with:
        client-id: ${{secrets.AZURE_CLIENT_ID}}
        tenant-id: ${{secrets.AZURE_TENANT_ID}}
        subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}
    
    - name: login ACR
      run: az acr login --name ${{secrets.ACR_NAME}}


    - name: build imagem
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.sha }} .
        docker tag ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.sha }} \
          ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:latest
    
    - name: push
      run: |
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.sha }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:latest
    
    - name: deploy ACI
      run: |
        az container create \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --name $IMAGE_NAME:$ \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:latest \
          --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --ports 80 \
          --dns-name-label $IMAGE_NAME \
          --os-type Linux
    
    - name: URL
      run:
        az container show --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name $IMAGE_NAME --query ipAddress.fqdn --output tsv


